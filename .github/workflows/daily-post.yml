name: 毎日の投稿の下書きを作る

on:
  schedule:
    # 毎日 22:07 (UTC) = 日本時間の朝 7:07
    # GitHub が混んでいると、数分〜数十分遅れることがあります
    - cron: "7 22 * * *"
  workflow_dispatch:

permissions:
  contents: write  # 作った文章と画像を posts/ に保存するため
  issues: write    # 下書きを Issue にして通知するため
  models: read     # GitHub Models（無料のAI）を使うため

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 日本語フォントとライブラリをインストール
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          pip install -r requirements.txt

      - name: 文章と画像を作る
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_URL_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/posts/
        run: python make_post.py

      - name: 文章と画像を保存する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/
          git commit -m "今日の投稿の下書き: $(TZ=Asia/Tokyo date +%F)"
          git push

      - name: Issue で通知する
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABEL: 毎日の投稿
        run: |
          gh label create "$LABEL" --color 1D9BF0 --force
          # 前の日の下書きが残っていたら閉じる
          gh issue list --label "$LABEL" --state open --json number --jq '.[].number' \
            | xargs -r -n1 gh issue close
          title="今日の投稿 $(TZ=Asia/Tokyo date +%-m月%-d日)"
          gh issue create --title "$title" --body-file issue_body.md --label "$LABEL" \
              --assignee "${{ github.repository_owner }}" \
            || gh issue create --title "$title" --body-file issue_body.md --label "$LABEL"
